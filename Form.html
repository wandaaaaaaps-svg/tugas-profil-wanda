<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formulir Pembelian Baju</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

    body {
      background: #ffe4e1;
      font-family: 'Comic Neue', cursive, 'Comic Sans MS', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .form-container {
      background: #fff0f5;
      border: 3px solid #ffb6c1;
      border-radius: 15px;
      padding: 30px 40px;
      width: 320px;
      box-shadow: 0 10px 15px rgba(255, 182, 193, 0.4);
      text-align: center;
    }

    h2 {
      color: #ff69b4;
      margin-bottom: 25px;
      font-weight: 700;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 6px;
      font-size: 1.1em;
      color: #d1477e;
    }

    input[type="text"],
    input[type="email"],
    select {
      width: 100%;
      padding: 10px;
      margin-bottom: 18px;
      border: 2px solid #ffb6c1;
      border-radius: 12px;
      font-size: 1em;
      outline: none;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    select:focus {
      border-color: #ff69b4;
      background: #fff0f5;
    }

    button {
      background-color: #ff69b4;
      color: white;
      border: none;
      padding: 14px 0;
      width: 100%;
      font-size: 1.2em;
      font-weight: 700;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 6px #d1477e;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #ff85c1;
    }

    button:active {
      box-shadow: none;
      transform: translateY(2px);
    }

    .message {
      margin-top: 20px;
      font-weight: 600;
      color: #d1477e;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Formulir Pembelian Baju</h2>
    <form id="orderForm">
      <label for="name">Nama Pembeli</label>
      <input type="text" id="name" name="name" placeholder="Masukkan nama" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Masukkan email" required />

      <label for="phone">Nomor HP</label>
      <input type="text" id="phone" name="phone" placeholder="Masukkan nomor HP" required />

      <label for="product">Pilih Baju</label>
      <select id="product" name="product" required>
        <option value="">-- Pilih Baju --</option>
        <option value="kemeja_blouse">Kemeja & Blouse</option>
        <option value="dress_pastel">Dress</option>
        <option value="jaket_lucu">Hoodie Zipper</option>
      </select>

      <label for="quantity">Jumlah</label>
      <input type="text" id="quantity" name="quantity" placeholder="Masukkan jumlah" required />

      <button type="submit">Pesan Sekarang</button>
    </form>
    <div class="message" id="message"></div>
  </div>

  <script>
    document.getElementById('orderForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = this.name.value;
      const email = this.email.value;
      const phone = this.phone.value;
      const product = this.product.options[this.product.selectedIndex].text;
      const quantity = this.quantity.value;

      if (!name || !email || !phone || !product || !quantity) {
        document.getElementById('message').textContent = 'Harap isi semua kolom dengan benar!';
        return;
      }

      document.getElementById('message').textContent =
        `Terima kasih, ${name}! Pesanan kamu: ${quantity} x ${product} sudah kami terima. Kami akan menghubungi melalui email ${email} atau telepon ${phone}.`;
      this.reset();
    });
  </script>
</body>
</html>
